<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>前端答题 — 引导式科研思维训练系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', "PingFang SC", "Microsoft YaHei", sans-serif; background: #0b0f19; color: #e2e8f0; }
    .serif-title { font-family: 'Noto Serif SC', serif; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-800 bg-slate-950/90 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-purple-500 to-amber-500 flex items-center justify-center font-bold text-white">L3</div>
        <div>
          <h1 class="text-lg font-bold text-white serif-title">前端答题</h1>
          <p class="text-xs text-slate-400" id="header-meta">读取后端题库，不另出一套题，也不按和论文像不像打分</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">返回题库审校</a>
        <button type="button" id="reset-btn" class="hidden px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">重新选题</button>
        <button type="button" id="logout-btn" class="px-3 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-200 border border-slate-700">退出</button>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-5">
    <p id="error" class="hidden text-sm text-rose-300 bg-rose-950/40 border border-rose-500/30 rounded-lg px-3 py-2"></p>

    <section id="setup" class="space-y-4">
      <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-6">
        <p class="text-xs uppercase tracking-wider text-slate-400">当前蓝图</p>
        <p class="mt-1 text-sm text-emerald-300" id="setup-paradigm">正在读取工作台里的训练蓝图…</p>
        <h2 class="mt-3 text-xl font-bold text-white serif-title">选一个切片开始答题</h2>
        <p class="mt-2 text-sm text-slate-400 leading-relaxed">先写自己的判断。没过逻辑安检时，导师只追问一个缺口；连续两轮都停在笼统说法上，才会给出几条价值相等的方向。阶段产出要你确认后才保存。论文里的专有做法要到对照这一步才出现。</p>
      </div>
      <div id="session-cards" class="grid sm:grid-cols-2 gap-3"></div>
    </section>

    <section id="play" class="hidden space-y-4">
      <div id="progress" class="flex flex-wrap gap-2"></div>

      <article class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 space-y-3">
        <div class="flex flex-wrap items-center gap-2 text-xs">
          <span id="phase-badge" class="px-2 py-0.5 rounded-full bg-indigo-500/15 text-indigo-200 border border-indigo-500/30"></span>
          <span id="slice-label" class="text-slate-400"></span>
        </div>
        <h2 id="stage-title" class="text-xl font-bold text-white serif-title"></h2>
        <p id="stage-subtitle" class="text-sm text-slate-400"></p>
        <p id="prompt-note" class="hidden text-xs text-amber-200/90"></p>
        <p id="prompt" class="text-sm leading-7 text-slate-100 whitespace-pre-wrap"></p>
        <p id="stage-note" class="hidden text-xs text-slate-400"></p>
      </article>

      <article class="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-5">
        <p class="text-xs text-amber-200/80">导师</p>
        <p id="tutor" class="mt-2 text-sm leading-7 text-amber-50 whitespace-pre-wrap"></p>
      </article>

      <div id="criteria-box" class="rounded-xl border border-slate-800 px-4 py-3">
        <p class="text-xs text-slate-400">这一关要自己说清</p>
        <ul id="criteria" class="mt-2 text-sm text-slate-300 space-y-1 list-disc pl-5"></ul>
      </div>

      <div id="answer-box" class="space-y-3">
        <label class="block text-xs text-slate-400" for="answer-text">你的回答</label>
        <textarea id="answer-text" maxlength="2000" rows="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-sm leading-6 focus:outline-none focus:border-indigo-500" placeholder="写你自己的判断，不用猜论文作者怎么想"></textarea>
        <div class="flex flex-wrap gap-2">
          <button type="button" id="submit-btn" class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white">提交回答</button>
          <button type="button" id="inspiration-btn" class="hidden px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm text-slate-100 border border-slate-700">我缺少可用的理论或方法，抽灵感卡片</button>
        </div>
      </div>

      <div id="options-box" class="hidden space-y-3">
        <p id="options-label" class="text-sm text-slate-300"></p>
        <p id="options-note" class="text-xs text-slate-400"></p>
        <div id="options" class="space-y-2"></div>
        <div id="custom-box" class="hidden space-y-2">
          <label class="block text-xs text-slate-400" for="custom-text">你自己的方向</label>
          <textarea id="custom-text" maxlength="500" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
          <button type="button" id="custom-submit" class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white">用这个方向</button>
        </div>
      </div>

      <div id="confirm-box" class="hidden space-y-3">
        <label class="block text-xs text-slate-400" for="confirm-text">确认后才会写入你的研究状态。可以改。</label>
        <textarea id="confirm-text" maxlength="2000" rows="6" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-sm leading-6 focus:outline-none focus:border-indigo-500"></textarea>
        <p id="open-questions" class="hidden text-xs text-slate-400"></p>
        <button type="button" id="confirm-btn" class="px-4 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold text-white">确认这段产出</button>
      </div>

      <section id="compare" class="hidden space-y-3">
        <div class="rounded-2xl border border-slate-800 p-5 space-y-2">
          <p id="compare-mode" class="text-sm font-semibold text-emerald-300"></p>
          <p id="compare-note" class="text-sm text-slate-300 leading-6"></p>
          <p id="compare-guide" class="text-sm text-slate-400 leading-6 whitespace-pre-wrap"></p>
        </div>
        <div class="grid lg:grid-cols-2 gap-3">
          <div class="rounded-2xl border border-slate-800 p-4">
            <p class="text-xs text-slate-400">你确认过的产出</p>
            <div id="student-chain" class="mt-3 space-y-3"></div>
          </div>
          <div class="rounded-2xl border border-slate-800 p-4">
            <p class="text-xs text-slate-400">论文论证锚点</p>
            <div id="expert-chain" class="mt-3 space-y-3"></div>
          </div>
        </div>
        <label class="block text-xs text-slate-400" for="reflection">反思（可以留空）</label>
        <textarea id="reflection" maxlength="2000" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" placeholder="你打算吸收什么，或者坚持哪一点"></textarea>
        <button type="button" id="ack-btn" class="px-4 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold text-white">进入下一关</button>
      </section>

      <section id="report" class="hidden space-y-4">
        <div id="scores" class="grid sm:grid-cols-2 gap-2"></div>
        <pre id="report-text" class="whitespace-pre-wrap text-sm leading-6 bg-slate-950 border border-slate-800 rounded-2xl p-4 text-slate-200"></pre>
        <button type="button" id="download-btn" class="px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm border border-slate-700">下载报告</button>
      </section>

      <details class="rounded-xl border border-slate-800 px-4 py-3">
        <summary class="text-xs text-slate-400 cursor-pointer">本关对话记录</summary>
        <div id="transcript" class="mt-3 space-y-2 text-sm"></div>
      </details>
    </section>
  </main>

  <script>
    let view = null;
    let busy = false;

    function esc(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showError(message) {
      const box = document.getElementById('error');
      if (!message) {
        box.classList.add('hidden');
        box.textContent = '';
        return;
      }
      box.textContent = message;
      box.classList.remove('hidden');
    }

    async function api(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/login';
        throw new Error('unauthorized');
      }
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const detail = typeof data.detail === 'string' ? data.detail : '请求没有完成';
        throw new Error(detail);
      }
      return data;
    }

    async function load() {
      try {
        view = await api('/api/answer');
        render();
      } catch (err) {
        if (err.message !== 'unauthorized') showError(err.message);
      }
    }

    function render() {
      const active = Boolean(view && view.active);
      document.getElementById('setup').classList.toggle('hidden', active);
      document.getElementById('play').classList.toggle('hidden', !active);
      document.getElementById('reset-btn').classList.toggle('hidden', !active);
      if (!active) {
        document.getElementById('setup-paradigm').textContent = view && view.paradigm_display
          ? view.paradigm_display
          : '使用工作台里当前的训练蓝图';
        const cards = document.getElementById('session-cards');
        cards.innerHTML = (view && view.sessions ? view.sessions : []).map((session) => `
          <button type="button" data-session="${esc(session.id)}" class="session-card text-left rounded-2xl border border-slate-800 bg-slate-900/70 hover:border-amber-500/50 p-4">
            <span class="block text-sm font-semibold text-white">${esc(session.label)}</span>
            <span class="block mt-1 text-xs text-slate-400 leading-5">${esc(session.detail)}</span>
          </button>
        `).join('');
        return;
      }

      document.getElementById('header-meta').textContent = view.paper_label
        ? view.paper_label
        : '论文标题在对照阶段再显示';
      document.getElementById('phase-badge').textContent = view.phase_label || '';
      document.getElementById('slice-label').textContent = view.micro_label || '';
      document.getElementById('stage-title').textContent = view.stage.title || '';
      document.getElementById('stage-subtitle').textContent = view.stage.subtitle || '';
      document.getElementById('prompt').textContent = view.stage.prompt || '';
      const note = document.getElementById('prompt-note');
      note.textContent = view.stage.prompt_note || '';
      note.classList.toggle('hidden', !view.stage.prompt_note);
      const stageNote = document.getElementById('stage-note');
      stageNote.textContent = view.stage.note || '';
      stageNote.classList.toggle('hidden', !view.stage.note);
      document.getElementById('tutor').textContent = view.tutor_message || '';
      document.getElementById('criteria').innerHTML = (view.stage.criteria || []).map((item) => `<li>${esc(item)}</li>`).join('');
      document.getElementById('progress').innerHTML = (view.progress || []).map((item) => {
        const tone = item.status === 'current'
          ? 'bg-indigo-500/20 text-indigo-100 border-indigo-400/40'
          : item.status === 'done'
            ? 'bg-emerald-500/15 text-emerald-200 border-emerald-400/30'
            : 'bg-slate-900 text-slate-500 border-slate-800';
        return `<span class="px-2 py-1 rounded-full border text-[11px] ${tone}">${esc(item.title)}</span>`;
      }).join('');

      const writing = view.phase === 'explore' || view.phase === 'probe' || view.phase === 'justify';
      document.getElementById('answer-box').classList.toggle('hidden', !writing);
      document.getElementById('inspiration-btn').classList.toggle('hidden', !view.can_inspiration);
      if (writing) document.getElementById('answer-text').value = '';

      const choosing = view.phase === 'choose';
      document.getElementById('options-box').classList.toggle('hidden', !choosing);
      document.getElementById('custom-box').classList.add('hidden');
      if (choosing) {
        document.getElementById('options-label').textContent = view.stage.options_type_label || '选一个方向';
        document.getElementById('options-note').textContent = view.options_note || '';
        document.getElementById('options').innerHTML = (view.options || []).map((option) => `
          <button type="button" data-key="${esc(option.key)}" class="option-btn w-full text-left rounded-xl border border-slate-700 hover:border-amber-400/60 bg-slate-950 px-3 py-3">
            <span class="text-xs text-amber-200">${esc(option.key)} · ${esc(option.dimension)}</span>
            <span class="block mt-1 text-sm text-slate-100">${esc(option.text)}</span>
          </button>
        `).join('');
      }

      const confirming = view.phase === 'synthesize';
      document.getElementById('confirm-box').classList.toggle('hidden', !confirming);
      if (confirming) {
        document.getElementById('confirm-text').value = view.draft_output || '';
        const gaps = document.getElementById('open-questions');
        if (view.open_questions && view.open_questions.length) {
          gaps.textContent = '未解疑点：' + view.open_questions.join('；');
          gaps.classList.remove('hidden');
        } else {
          gaps.classList.add('hidden');
        }
      }

      const comparing = view.phase === 'compare';
      document.getElementById('compare').classList.toggle('hidden', !comparing);
      const lastStep = view.progress && view.progress[view.progress.length - 1];
      document.getElementById('ack-btn').textContent = lastStep && lastStep.status === 'current'
        ? '生成构思报告'
        : '进入下一关';
      if (comparing && view.comparison) renderComparison(view.comparison, false);

      const reporting = view.phase === 'report';
      document.getElementById('report').classList.toggle('hidden', !reporting);
      document.getElementById('criteria-box').classList.toggle('hidden', reporting);
      document.querySelector('#play article').classList.toggle('hidden', reporting);
      if (reporting && view.report) {
        document.getElementById('scores').innerHTML = (view.report.dimensions || []).map((item) => `
          <div class="rounded-xl border border-slate-800 px-3 py-2">
            <p class="text-xs text-slate-400">${esc(item.name)}</p>
            <p class="text-sm text-white mt-1">${item.level}/3 · ${esc(item.label)}</p>
          </div>
        `).join('');
        document.getElementById('report-text').textContent = view.report.text || '';
        if (view.comparison) {
          document.getElementById('compare').classList.remove('hidden');
          renderComparison(view.comparison, true);
          document.getElementById('ack-btn').classList.add('hidden');
          document.getElementById('reflection').classList.add('hidden');
          document.querySelector('label[for="reflection"]').classList.add('hidden');
        }
      } else {
        document.getElementById('ack-btn').classList.remove('hidden');
        document.getElementById('reflection').classList.remove('hidden');
        document.querySelector('label[for="reflection"]').classList.remove('hidden');
      }

      document.getElementById('transcript').innerHTML = (view.messages || []).map((item) => `
        <p><span class="text-slate-500">${item.role === 'tutor' ? '导师' : '我'}</span> ${esc(item.text)}</p>
      `).join('');
    }

    function renderComparison(comparison, hideAck) {
      document.getElementById('compare-mode').textContent = comparison.mode_label || '';
      document.getElementById('compare-note').textContent = comparison.note || '';
      document.getElementById('compare-guide').textContent = comparison.guide || '';
      const chain = (view.research_state && view.research_state.stages) || [];
      document.getElementById('student-chain').innerHTML = chain.length
        ? chain.map((item) => `<div><p class="text-xs text-slate-500">第 ${item.stage_number} 关</p><p class="text-sm leading-6 whitespace-pre-wrap">${esc(item.confirmed_output)}</p></div>`).join('')
        : '<p class="text-sm text-slate-500">还没有确认过的产出。</p>';
      const experts = comparison.stages || [];
      document.getElementById('expert-chain').innerHTML = experts.map((stage) => {
        const anchors = (stage.anchors || []).map((anchor) => `
          <div class="mt-2">
            <p class="text-xs text-slate-500">Point ${esc(anchor.point)} · ${esc(anchor.label)}</p>
            <p class="text-sm text-slate-200">${esc(anchor.summary)}</p>
            ${anchor.display_quote ? `<p class="text-xs text-slate-400 mt-1">「${esc(anchor.display_quote)}」</p>` : ''}
          </div>
        `).join('');
        return `<div><p class="text-sm text-slate-200">${esc(stage.title)}</p>${anchors || '<p class="text-xs text-slate-500 mt-1">这一关没有可展示的原文锚点。</p>'}</div>`;
      }).join('');
      if (hideAck) {
        document.getElementById('ack-btn').classList.add('hidden');
      }
    }

    async function withBusy(task) {
      if (busy) return;
      busy = true;
      showError('');
      try {
        view = await task();
        render();
      } catch (err) {
        if (err.message !== 'unauthorized') showError(err.message);
      } finally {
        busy = false;
      }
    }

    document.getElementById('session-cards').addEventListener('click', (event) => {
      const button = event.target.closest('.session-card');
      if (!button) return;
      withBusy(() => api('/api/answer/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ micro_session: button.dataset.session })
      }));
    });

    document.getElementById('submit-btn').addEventListener('click', () => {
      withBusy(() => api('/api/answer/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: document.getElementById('answer-text').value })
      }));
    });

    document.getElementById('options').addEventListener('click', (event) => {
      const button = event.target.closest('.option-btn');
      if (!button) return;
      if (button.dataset.key === 'E') {
        document.getElementById('custom-box').classList.remove('hidden');
        return;
      }
      withBusy(() => api('/api/answer/choose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: button.dataset.key })
      }));
    });

    document.getElementById('custom-submit').addEventListener('click', () => {
      withBusy(() => api('/api/answer/choose', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: 'E', custom_text: document.getElementById('custom-text').value })
      }));
    });

    document.getElementById('confirm-btn').addEventListener('click', () => {
      withBusy(() => api('/api/answer/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ confirmed_output: document.getElementById('confirm-text').value })
      }));
    });

    document.getElementById('ack-btn').addEventListener('click', () => {
      const last = view && view.progress ? view.progress[view.progress.length - 1] : null;
      const finishing = last && last.status === 'current';
      if (finishing) document.getElementById('ack-btn').textContent = '生成构思报告';
      withBusy(() => api('/api/answer/acknowledge', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: document.getElementById('reflection').value })
      }));
    });

    document.getElementById('inspiration-btn').addEventListener('click', () => {
      withBusy(() => api('/api/answer/inspiration', { method: 'POST' }));
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      withBusy(() => api('/api/answer/reset', { method: 'POST' }));
    });

    document.getElementById('download-btn').addEventListener('click', () => {
      if (!view || !view.report) return;
      const blob = new Blob([view.report.text || ''], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = '科研构思报告.txt';
      link.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    });

    load();
  </script>
</body>
</html>
